AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentShield -- deterministic, rule-based session-evaluation API.
  Cost-conscious "Ship It" architecture: API Gateway -> Lambda (the
  engine itself; no GPU/inference cost, nothing per-token) with
  DynamoDB for the policy registry and CloudWatch for the decision
  audit log. See DEPLOY.md for what is and isn't wired in this build.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12

Resources:
  EvaluateSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infra/lambda_handler.handler
      CodeUri: ../
      Description: Deterministic session evaluation (same engine as api/main.py)
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PolicyTable
      Events:
        Evaluate:
          Type: Api
          Properties:
            RestApiId: !Ref AgentShieldApi
            Path: /sessions/{sessionId}/evaluate
            Method: post

  AgentShieldApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true
      # Smallest safe production config needed for the static frontend
      # (deployed separately, e.g. to AWS Amplify) to call this API
      # directly from a browser -- confirmed via a live OPTIONS/POST
      # check that without this, browsers block the request entirely.
      # SAM auto-generates the OPTIONS preflight handling for every
      # path/method declared under Events; the actual POST response
      # still needs the same headers, added by the Lambda itself (see
      # infra/lambda_handler.py's _response helper) since this uses
      # Lambda proxy integration, not a mock integration. No new
      # resource, no change to the function's decision logic, no
      # authentication added -- this API returns no sensitive/user-
      # specific data, so a wildcard origin is an intentional,
      # cost-conscious choice for a public hackathon demo, not an
      # oversight.
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
      # Conservative, no-auth abuse/cost protection: stage-level default
      # throttling applied to every method/resource, so it protects the
      # public endpoint without requiring an API key or any change to
      # who can call it. ~2 req/s steady-state comfortably covers a
      # person clicking through the demo (one call per click); a burst
      # of 10 absorbs several quick clicks in a row. Sustained abuse
      # beyond that gets a native API Gateway 429 before Lambda is ever
      # invoked, rather than continuing to invoke (and pay for) it.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 10

  # Intended production home for policy/*.yaml's content (conflict
  # classes, clearance thresholds). Provisioned here so the schema and
  # IAM wiring are real and reviewable; the bundled hackathon Lambda
  # currently reads the equivalent data from the YAML files packaged
  # alongside the code instead of this table at request time -- see
  # DEPLOY.md "Known limitations" for why, and what reading from this
  # table at cold-start would require.
  PolicyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Intended production home for per-session graph state in an
  # incremental architecture (one API call per tool call, rather than
  # this build's one-call-per-complete-trajectory shape). Not written
  # to by EvaluateSessionFunction in this build -- see DEPLOY.md.
  SessionGraphTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: call_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: call_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Cost-alert only -- NOT a spending shutdown. Tracks total account
  # spend (this hackathon account has no other production workload, so
  # an account-wide budget is the simplest accurate signal; it doesn't
  # touch or modify any other resource). $10/month is intentionally low
  # for a serverless demo that should cost cents; a single ACTUAL-spend
  # notification at 80% ($8) emails a warning -- nothing is throttled,
  # disabled, or deleted automatically if this fires.
  CostAlertBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-cost-alert"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: mr.guptarnav@gmail.com

Outputs:
  ApiUrl:
    Description: Invoke URL for POST /sessions/{sessionId}/evaluate
    Value: !Sub "https://${AgentShieldApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  PolicyTableName:
    Value: !Ref PolicyTable
  SessionGraphTableName:
    Value: !Ref SessionGraphTable
